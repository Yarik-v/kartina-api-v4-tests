            logo:
              type: string
              format: uri
              example: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png'
            playable:
              type: boolean
              description: 'Always true'
            favorite:
              type: boolean
              description: 'In favorites; always false for protected channels'
            capabilities:
              type: object
