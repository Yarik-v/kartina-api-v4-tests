          headers:
            X-Api-Error-Code:
              $ref: '#/components/headers/apiErrorCode'
            X-Api-Error-Message:
              $ref: '#/components/headers/apiErrorMessage'
        '403':
          description: 'Wrong current protect code (`E_CURRENT_PASS_BAD`) or authentication required (`E_AUTH_ERROR`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                wrongCurrentCode:
                  summary: 'old code does not match'
                  value: { error: { type: E_CURRENT_PASS_BAD, code: 19, message: 'Неверный пароль.', request_id: 019f31e7-66f5-7670-8f3a-7f50f19bb32e, details: { title: null, description: 'Incorrect current code' } } }
