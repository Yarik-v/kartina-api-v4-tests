  /protect-code/change:
    post:
      operationId: changeProtectCode
      summary: 'Change the client protect (parental) code.'
      description: 'Sets `new` after verifying the current code (`old`).'
      tags:
        - Client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old
                - new
                - confirm
              additionalProperties: false
              properties:
                old:
                  type: string
                  description: 'Current protect code'
                  example: '1234'
                new:
                  type: string
                  description: 'New protect code (numeric, `1`–`4294967295`)'
                  example: '123456'
                confirm:
                  type: string
                  description: 'New protect code confirmation (must equal `new`)'
                  example: '123456'
      responses:
        '200':
          description: 'Code changed'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                additionalProperties: false
                properties:
                  success: { type: boolean, example: true }
          headers:
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '400':
          description: 'Missing parameter, confirmation mismatch, or invalid new code'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                missingParam:
                  summary: 'a required field not provided'
                  value: { error: { type: E_NEED_PARAM, code: 23, message: 'Need parameter', request_id: 019f31e7-33c2-7670-8f3a-7f50f19bb32e, details: { title: null, description: 'old: This value should not be blank.' } } }
                confirmMismatch:
