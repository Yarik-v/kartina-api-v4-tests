  /sharing/status:
    get:
      operationId: getSharingStatus
      summary: 'Get friend account registration and invitation status.'
      description: 'Mobile Free users only.'
      tags:
        - Sharing
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                type: object
                required:
                  - friend_status
                  - invitation_status
                  - days_since_invitation
                additionalProperties: false
                properties:
                  friend_status: { type: [string, 'null'], description: "Registration flow progress:\n- `null`: not started\n- `pending`: code sent, awaiting input\n- `failed`: code verification failed (can retry)\n- `success`: account created\n", enum: [pending, failed, success], example: pending }
                  invitation_status: { type: string, description: "Lifecycle stage by days since acceptance (defaults):\n- `active`: nothing to do\n- `optional_registration`: 30+ unregistered, suggest registering\n- `required_registration`: 60+ unregistered, must register\n- `invitation_expired`: 90+ unregistered, access revoked\n- `subscription_required`: 180+ registered, must buy a subscription\n", enum: [active, optional_registration, required_registration, invitation_expired, subscription_required], example: active }
                  days_since_invitation: { type: [integer, 'null'], description: 'Days since the invitation was accepted; `null` if not yet.', example: 0 }
              examples:
                freshlyRedeemed:
                  summary: 'Just redeemed, not registered yet'
                  value: { friend_status: pending, invitation_status: active, days_since_invitation: 0 }
                registered:
                  summary: 'Registered successfully'
                  value: { friend_status: success, invitation_status: active, days_since_invitation: 5 }
                needsRegistration:
                  summary: 'Optional registration reminder (30+ days)'
                  value: { friend_status: pending, invitation_status: optional_registration, days_since_invitation: 35 }
                mustRegister:
                  summary: 'Required registration (60+ days)'
                  value: { friend_status: pending, invitation_status: required_registration, days_since_invitation: 65 }
                expired:
                  summary: 'Invitation expired (90+ days unregistered)'
                  value: { friend_status: pending, invitation_status: invitation_expired, days_since_invitation: 95 }
                needsSubscription:
                  summary: 'Registered but needs own subscription (180+ days)'
                  value: { friend_status: success, invitation_status: subscription_required, days_since_invitation: 200 }
          headers:
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
