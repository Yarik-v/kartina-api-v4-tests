          example: 'Продолжить просмотр'
        type:
          type: string
          const: playback
        count:
          type: integer
          description: 'Number of items in the block'
          example: 2
        items:
          type: array
          description: 'Most recent first: `programCard` for TV, `playbackContentCard` for VOD'
          items:
            oneOf:
              -
                $ref: '#/components/schemas/programCard'
              -
                $ref: '#/components/schemas/playbackContentCard'
    programCard:
      type: object
      description: 'A TV programme in "continue watching". No `details_url`: see the channel guide (`epg_url`).'
      required:
        - id
        - kind
        - service
        - starts_at
        - ends_at
        - title
        - subtitle
        - description
        - year
        - genres
        - runtime
        - age_rating
        - ratings
        - images
        - channel
        - teleteka
        - playable
        - favorite
        - progress
        - play_url
        - epg_url
      additionalProperties: false
      properties:
        id:
          type: string
          description: '`<provider>:<channel id>:<programme start>`'
          example: 'archive:105:1781766000'
        kind:
          type: string
          const: program
        service:
          type: string
          const: channels
        starts_at:
          type: integer
          description: 'Programme start (Unix time, real broadcast time)'
          example: 1781766000
        ends_at:
          type: integer
          description: 'Programme end (Unix time, real broadcast time)'
          example: 1781769600
        title:
          type: string
          description: 'Programme title'
          example: Время
        subtitle:
          type:
            - string
            - 'null'
          description: 'Programme subtitle (e.g. the episode name)'
          example: null
        description:
          type:
            - string
            - 'null'
          example: 'Информационная программа о событиях в стране и мире.'
        year:
          type:
            - string
            - 'null'
          description: 'Production year(s) as given by the EPG, e.g. `2024` or `2019-2021`'
          example: null
        genres:
          type: array
          items:
            type: string
          example:
            - 'информационная программа'
        runtime:
          type: integer
          description: 'Programme (or teleteka file) duration in seconds'
          example: 3600
        age_rating:
          type:
            - integer
            - 'null'
          description: 'Minimum viewer age'
          example: 16
        ratings:
          type: object
          required:
            - kinopoisk
            - imdb
          additionalProperties: false
          properties:
            kinopoisk:
              type:
                - number
                - 'null'
              example: null
            imdb:
              type:
                - number
                - 'null'
              example: null
        images:
          type: object
          required:
            - poster
            - landscape
          additionalProperties: false
          properties:
            poster:
              type: 'null'
              description: 'Always null for TV programmes'
            landscape:
              type: string
              format: uri
              description: 'Programme artwork (16x9); falls back to the channel EPG image'
        channel:
          type: object
          description: 'The channel the programme belongs to'
          required:
            - id
            - title
            - logo
          additionalProperties: false
          properties:
            id:
              type: string
              example: '105'
            title:
              type: string
              example: 'Первый канал HD'
            logo:
              type: string
              format: uri
              example: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png'
        teleteka:
          type: boolean
          description: 'Whether the programme has a teleteka recording'
        playable:
          type: boolean
          description: 'Whether the item can be played directly (currently always true)'
        favorite:
          type: boolean
          description: "Always false: programmes aren't favoritable"
        progress:
          $ref: '#/components/schemas/progress'
        play_url:
          type: string
          format: uri-reference
          description: 'Plays the programme (`GET`) from the teleteka or archive; resume at `progress.position`'
          example: /api/v4/channels/105/archive/1781766000
        epg_url:
          type: string
          format: uri-reference
          description: "The channel's programme guide (`GET`)"
          example: /api/v4/channels/105/epg
    playbackContentCard:
      type: object
      description: 'A VOD title in "continue watching": a content card plus `subtitle`, `age_rating`, `progress` and `play_url`.'
      required:
        - id
        - kind
        - service
        - title
        - subtitle
        - description
        - year
        - genres
        - runtime
        - age_rating
        - ratings
        - images
        - playable
        - favorite
        - progress
        - details_url
        - play_url
        - favorite_url
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Content identifier within the service'
          example: 6a0188bc9e35a34e3a098ec7
        kind:
          type: string
          description: '`series` when the title is an episode container'
          enum:
            - movie
            - series
          example: series
        service:
          type: string
          description: 'Canonical service identifier'
          example: mediateka
        title:
          type: string
          example: Простоквашино
        subtitle:
          type:
            - string
            - 'null'
          description: 'Title of the episode to resume (null for movies)'
          example: 'Серия 5'
        description:
          type: string
          description: 'Description of the episode to resume, else of the title'
          example: 'Родители не разрешают мальчику по прозвищу Дядя Фёдор заводить животных, и он вместе с говорящим котом Матроскиным и псом Шариком бежит из дома в деревню Простоквашино.'
        year:
          type:
            - string
            - 'null'
          description: 'Release year'
          example: '2025'
        genres:
          type: array
          items:
            type: string
          example:
            - Приключения
            - Семейный
        runtime:
          type:
            - integer
            - 'null'
          description: 'Runtime of the episode to resume (or the movie) in seconds'
          example: 1302
        age_rating:
          type:
            - integer
            - 'null'
          description: 'Minimum viewer age'
          example: 6
        ratings:
          type: object
          required:
            - kinopoisk
            - imdb
          additionalProperties: false
          properties:
            kinopoisk:
              type:
                - number
                - 'null'
              example: 6.8
            imdb:
              type:
                - number
                - 'null'
              example: null
        images:
          type: object
          required:
            - poster
            - landscape
          additionalProperties: false
          properties:
            poster:
              type:
                - string
                - 'null'
              format: uri
              description: "Poster (2x3), possibly with a state badge (`new`, `final`, …) and an external provider's logo"
            landscape:
              type:
                - string
                - 'null'
              format: uri
              description: 'Landscape (16x9) image of the episode to resume, else of the title'
        playable:
          type: boolean
          description: 'Whether the item can be played directly (currently always true)'
        favorite:
          type: boolean
          description: "Whether the title is in the client's favorites"
        progress:
          $ref: '#/components/schemas/progress'
        details_url:
          type: string
          format: uri-reference
          description: 'Full details of the title (`GET`)'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7
        play_url:
          type: string
          format: uri-reference
          description: 'Playback endpoint for the title (`GET`)'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/play
        favorite_url:
          type: string
          format: uri-reference
          description: '`PUT` adds to favorites, `DELETE` removes'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/favorite
    progress:
      type: object
      description: 'Continue-watching state. `target` is what `position` refers to: the movie, programme or episode to resume.'
      required:
        - position
        - duration
        - completed
        - updated_at
        - target
      additionalProperties: false
      properties:
        position:
          type: integer
          description: 'Seconds watched; 0 for an unwatched or next episode'
          example: 420
        duration:
          type:
            - integer
            - 'null'
          description: 'Target duration in seconds'
          example: 1302
        completed:
          type: boolean
          description: 'Currently always false'
        updated_at:
          type:
            - integer
            - 'null'
          description: 'Unix time of the last viewing event, null when never watched'
          example: 1781767250
        target:
          type: object
          description: 'What playback resumes at; in content details, episodes add `season_number` / `episode_number`'
          required:
            - id
            - kind
          additionalProperties: false
          properties:
            id:
              type: string
              example: 6a0188bc9e35a34e3a098ec8
            kind:
              type: string
              enum:
                - movie
                - series
                - episode
                - program
              example: episode
            season_number:
              type:
                - integer
                - 'null'
              description: 'Null for episodes without a season'
              example: 1
            episode_number:
              type: integer
              example: 1
    channelEpg:
      type: object
      description: "A channel's programme guide."
      required:
        - channel
        - count
        - items
      additionalProperties: false
      properties:
        channel:
          type: object
          description: 'The channel the guide belongs to'
          required:
            - id
            - kind
            - title
            - logo
            - playable
            - favorite
            - capabilities
            - access
            - epg_url
            - play_url
