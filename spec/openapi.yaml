                  code: 54
                  message: 'Ошибка внешнего сервиса.'
                  request_id: 019ed9f8-43a7-79e7-ac45-ba3f645633a2
                  details: { title: Ой!, description: 'Не удалось удалить друга. Попробуйте позже.' }
          headers:
            X-Api-Error-Code:
              $ref: '#/components/headers/apiErrorCode'
            X-Api-Error-Message:
              $ref: '#/components/headers/apiErrorMessage'
components:
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: MW_SSID
      description: 'Session id issued on login. Also returned in the login/account body as `security` and set as the `MW_SSID` cookie.'
  headers:
    apiVersion:
      schema:
        type: integer
      description: 'API version that produced the response.'
      example: 4
    apiServertime:
      schema:
        type: integer
      description: 'Server Unix timestamp.'
      example: 1781773057
    apiMessages:
      schema:
        type: integer
      description: 'Number of pending client messages.'
      example: 0
    apiErrorCode:
      schema:
        type: integer
      description: 'Numeric error code, mirrors `error.code`. Present on error responses.'
      example: 12
    apiErrorMessage:
      schema:
        type: string
      description: 'English error message, mirrors `error.message`. Present on error responses.'
      example: 'Authentication error'
    etag:
      schema:
        type: string
      description: 'Entity tag of the response payload. Send it back in `If-None-Match` to revalidate cheaply (304 on match).'
      example: 703f7feeb2b1a3c4
  schemas:
    error:
      type: object
      description: "Standard v4 error envelope (`application/problem+json`). Branch on `error.code` together\nwith the HTTP status; `type` and `message` derive from the code, `details.description`\ncarries the request-specific context.\n"
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - request_id
            - details
          additionalProperties: false
          properties:
            type:
              type:
                - string
                - 'null'
              description: 'Error-code constant name, or null when the code is unmapped.'
              example: E_AUTH_ERROR
            code:
              type: integer
              description: 'Numeric error code.'
              example: 12
            message:
              type: string
              description: 'Message derived from the code (may be localized; the English form is also in the `X-Api-Error-Message` header).'
              example: 'Authentication error'
            request_id:
              type: string
              description: 'Request correlation id (UUID v7).'
              example: 019ed9ed-812d-7b02-b5e9-767e08a8fa58
            details:
              type: object
              description: 'Extra context - `title`/`description` plus any error-specific extension fields.'
              properties:
                title:
                  type: [string, 'null']
                  example: null
                description:
                  type: [string, 'null']
                  example: 'Wrong session. Client is not authorized'
    pagination:
      type: object
      properties:
        total:
          type: integer
          description: 'Total amount of data'
          example: 2
    createdAt:
      type: string
      description: 'Date created'
      example: '2021-10-28T16:19:44+00:00'
    updatedAt:
      type:
        - string
        - 'null'
      description: 'Last update'
      example: '2021-10-28T16:19:44+00:00'
    link:
      type: object
      required:
        - title
        - method
      properties:
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - DELETE
        path:
          type:
            - string
            - 'null'
    playbackStream:
      type: object
      description: "A playable stream, returned by every `play_url` target except the trailer one, which\nanswers with the URL alone (`trailerStream`).\n\nThe URL embeds a ticket bound to the client, the device and a short validity window.\nFetch it per playback, do not store it: these responses carry no `ETag` and must not be\ncached or shared between devices.\n\nThe shape is the same for every source, but only search-indexed VOD fills `markers`;\nchannels, teleteka and premierone leave it null.\n"
      required:
        - url
        - markers
        - vmap
      additionalProperties: false
      properties:
        url:
          type: string
          description: "Playable stream URL. Channel streams may use the `http/ts://` scheme with\ntrailing space-separated player hints; VOD streams are plain HTTP(S) HLS.\n"
          example: 'https://streamer-fra-c4-b7.kartina.tv:443/vod/hls/videoteka/moretv/CTC-ModnyiSindikat/CTC-ModnyiSindikat_s1e1/index.m3u8?ticket=KKCRzM1UyR2n6MqLtOCQAr3n0%2FNMKrttq0g8h%2F4onmzdwlP%2FgmV%2F5fdQ'
        markers:
          description: "Sections a player may offer to skip. Null for sources that publish none: channels,\nthe archive, teleteka and premierone.\n"
          oneOf:
            -
              $ref: '#/components/schemas/skipMarkers'
            -
              type: 'null'
        vmap:
          type:
            - string
            - 'null'
          description: 'Ad-break VMAP document. Reserved; currently always null.'
          example: null
    skipMarkers:
      type: object
      description: 'Skippable sections of a VOD item, in seconds from the start of the stream. A section with `start` and `end` both 0 means "not detected".'
      required:
        - intro
        - recap
        - closing_credits
      additionalProperties: false
      properties:
        intro:
          $ref: '#/components/schemas/skipMarkerRange'
        recap:
          $ref: '#/components/schemas/skipMarkerRange'
        closing_credits:
          $ref: '#/components/schemas/skipMarkerRange'
    skipMarkerRange:
      type: object
      required:
        - start
        - end
      additionalProperties: false
      properties:
        start:
          type: integer
          minimum: 0
          example: 0
        end:
          type: integer
          minimum: 0
          example: 0
    channelGroupBlock:
      type: object
      description: 'A TV channel-group block with its channels.'
      required:
        - id
        - title
        - type
        - count
        - protected
        - items
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Channel-group identifier'
          example: '2'
        title:
          type: string
          description: 'Channel-group display title'
          example: Основные
        type:
          type: string
          const: channel_group
        count:
          type: integer
          description: 'Number of items in the block'
          example: 44
        protected:
          type: boolean
          description: 'Any channel in `items` is protected'
          example: false
        items:
          type: array
          items:
            $ref: '#/components/schemas/channelCard'
    channelCard:
      type: object
      description: "A TV channel as a block item. Archive and teleteka URLs are built by the client:\n`/channels/{id}/archive/{starts_at}`, `/channels/{id}/teleteka/{starts_at}`.\n"
      required:
        - id
        - kind
        - title
        - images
        - playable
        - favorite
        - capabilities
        - access
        - current_program
        - play_url
        - epg_url
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Channel identifier'
          example: '105'
        kind:
          type: string
          description: 'Channel kind'
          enum:
            - channel
            - playlist
            - radio
          example: channel
        title:
          type: string
          description: 'Channel name; a timeshifted variant ends with the shift, e.g. `Первый канал HD [-3]`'
          example: 'Первый канал HD'
        images:
          type: object
          required:
            - logo
            - background
          additionalProperties: false
          properties:
            logo:
              type:
                - string
                - 'null'
              format: uri
              description: 'Channel logo'
              example: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png'
            background:
              type:
                - string
                - 'null'
              format: uri
              description: 'Channel background (EPG) image'
              example: 'https://imgcdnv2.kartina.stream/img/ui/epg-00105.png'
        playable:
          type: boolean
          description: 'Whether the item can be played directly (currently always true)'
        favorite:
          type: boolean
          description: 'In favorites; always false for protected channels'
        capabilities:
          type: object
          required:
            - archive
            - timeshift
          additionalProperties: false
          properties:
            archive:
              type: boolean
              description: 'Catch-up archive is available (the teleteka is gated separately)'
            timeshift:
              type: boolean
              description: 'This item is a timeshifted channel variant'
        access:
          type: object
          required:
            - protected
            - hidden
          additionalProperties: false
          properties:
            protected:
              type: boolean
              description: 'Channel is behind the account protect code'
            hidden:
              type: boolean
              description: 'The client hid this channel (only with `show=1`)'
        current_program:
          $ref: '#/components/schemas/currentProgram'
        play_url:
          type: string
          format: uri-reference
          description: 'Live playback endpoint for the channel (`GET`)'
          example: /api/v4/channels/105/play
        epg_url:
          type: string
          format: uri-reference
          description: "The channel's programme guide (`GET`)"
          example: /api/v4/channels/105/epg
        favorite_url:
          type: string
          format: uri-reference
          description: '`PUT` adds to favorites, `DELETE` removes; absent for protected channels'
          example: /api/v4/channels/105/favorite
    radioGroupBlock:
      type: object
      description: 'The radio channel-group block with its stations.'
      required:
        - id
        - title
        - type
        - count
        - protected
        - items
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Channel-group identifier (always the radio group)'
          example: '23'
        title:
          type: string
          description: 'Channel-group display title'
          example: Радио
        type:
          type: string
          const: channel_group
        count:
          type: integer
          description: 'Number of items in the block'
          example: 17
        protected:
          type: boolean
          description: 'Any station in `items` is protected'
          example: false
        items:
          type: array
          items:
            $ref: '#/components/schemas/radioCard'
    radioCard:
      type: object
      description: 'A radio station as a block item: a `channelCard` without `current_program` and `epg_url`.'
      required:
        - id
