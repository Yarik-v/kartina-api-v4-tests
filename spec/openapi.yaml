              description: 'Station logo; 1:1 for mobile devices, 16:9 otherwise'
              example: 'https://imgcdnv2.kartina.stream/img/ui/radio/95/logo_16x9.png?action=resize&width=250&height=140'
            background:
              type:
                - string
                - 'null'
              format: uri
              description: 'Station background'
              example: 'https://imgcdnv2.kartina.stream/img/ui/radio/95/background_16x9.png?action=resize&width=1280&height=720'
        playable:
          type: boolean
          description: 'Whether the item can be played directly (currently always true)'
        favorite:
          type: boolean
          description: 'In favorites; always false for protected stations'
        capabilities:
          type: object
          required:
            - archive
            - timeshift
          additionalProperties: false
          properties:
            archive:
              type: boolean
              description: 'Always false'
            timeshift:
              type: boolean
              description: 'Always false'
        access:
          type: object
          required:
            - protected
            - hidden
          additionalProperties: false
          properties:
            protected:
              type: boolean
              description: 'Station is behind the account protect code'
            hidden:
              type: boolean
              description: 'The client hid this station (only with `show=1`)'
        play_url:
          type: string
          format: uri-reference
          description: 'Playback endpoint for the station (`GET`)'
          example: /api/v4/channels/95/play
        favorite_url:
          type: string
          format: uri-reference
          description: '`PUT` adds to favorites, `DELETE` removes; absent for protected stations'
          example: /api/v4/channels/95/favorite
    currentProgram:
      type: object
      description: "The programme on air now (respecting the item's timeshift)."
