          enum:
            - default
            - avatar_1
            - avatar_2
            - avatar_3
            - avatar_4
            - avatar_5
            - null
          example: avatar_2
        age_band:
          type: integer
          description: 'Maximum content age; `0` means no restriction'
          enum:
            - 0
            - 7
            - 12
            - 16
          example: 12
    profileSwitchPayload:
