        - title
        - description
        - year
        - runtime
        - age_rating
        - genres
        - countries
        - directors
        - actors
        - ratings
        - images
        - playable
        - favorite
        - progress
        - trailers
        - seasons
        - play_url
        - favorite_url
        - similar_url
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Content identifier within the service'
          example: 6a0188bc9e35a34e3a098ec7
        service:
          type: string
          description: 'Canonical service identifier (aliases are resolved)'
          example: mediateka
        kind:
          type: string
          description: '`series` when the title is an episode container'
          enum:
            - movie
            - series
          example: series
        title:
          type: object
          description: 'Title variants (currently identical)'
          required:
            - original
            - display
            - short
          additionalProperties: false
          properties:
            original:
              type: string
              example: Простоквашино
            display:
              type: string
              example: Простоквашино
            short:
              type: string
              example: Простоквашино
        description:
          type: object
          description: 'Description variants (currently identical)'
          required:
            - short
            - full
          additionalProperties: false
          properties:
            short:
              type: string
            full:
              type: string
        year:
          type:
            - string
            - 'null'
          description: 'Release year'
          example: '2025'
        runtime:
          type:
            - integer
            - 'null'
          description: 'Runtime in seconds (typically null for series)'
          example: null
        age_rating:
          type:
            - integer
            - 'null'
          description: 'Minimum viewer age'
          example: 6
        genres:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        directors:
          type: array
          items:
            type: string
        actors:
          type: array
          items:
            type: string
        ratings:
          type: object
          required:
            - kinopoisk
            - imdb
          additionalProperties: false
          properties:
            kinopoisk:
              type:
                - number
                - 'null'
              example: 6.8
            imdb:
              type:
                - number
                - 'null'
              example: null
        images:
          type: object
          required:
            - poster
            - landscape
            - logo
            - frames
          additionalProperties: false
          properties:
            poster:
              type:
                - string
                - 'null'
              format: uri
              description: 'Poster (2x3) image'
            landscape:
              type:
                - string
                - 'null'
              format: uri
              description: 'Landscape (16x9) image'
            logo:
              type: 'null'
              description: 'Reserved; always null'
            frames:
              type: array
              description: 'Still frames (16x9)'
              items:
                type: string
                format: uri
        playable:
          type: boolean
          description: 'Whether the title can be played (currently always true)'
        favorite:
          type: boolean
          description: "Whether the title is in the client's favorites"
        progress:
          $ref: '#/components/schemas/progress'
        trailers:
          type: array
          items:
            $ref: '#/components/schemas/trailer'
        seasons:
          type: array
          description: 'Empty for movies; episodes without a season go under `number: null`'
          items:
            $ref: '#/components/schemas/season'
        play_url:
          type: string
          format: uri-reference
          description: 'Playback endpoint for the title (`GET`)'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/play
        favorite_url:
          type: string
          format: uri-reference
          description: '`PUT` adds to favorites, `DELETE` removes'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/favorite
        similar_url:
          type: string
          format: uri-reference
          description: 'Titles similar to this one (`GET`)'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/similar
    trailer:
      type: object
      required:
        - id
        - title
        - play_url
      additionalProperties: false
      properties:
        id:
          type: string
          example: 6a0188bc9e35a34e3a098f00
        title:
          type: string
          example: Трейлер
        play_url:
          type: string
          format: uri-reference
          description: 'Playback endpoint for the trailer (`GET`)'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/trailers/6a0188bc9e35a34e3a098f00/play
    season:
      type: object
      required:
        - id
        - number
        - title
        - episode_count
        - episodes
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Season id, or the season number if the service has none'
          example: '1'
        number:
          type:
            - integer
            - 'null'
          description: 'Season number; null for episodes without a season'
          example: 1
        title:
          type: string
          description: 'Season title (`Отдельные эпизоды` for episodes without a season)'
          example: 'Сезон 1'
        episode_count:
          type: integer
          example: 8
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/episode'
    episode:
      type: object
      required:
        - id
        - kind
        - number
        - title
        - description
        - runtime
        - images
        - progress
      additionalProperties: false
      properties:
        id:
          type: string
          example: 6a0188bc9e35a34e3a098ec8
        kind:
          type: string
          const: episode
        number:
          type: integer
          description: 'Sequential number within the season (1-based)'
          example: 1
        title:
          type: string
          example: '1 серия'
        description:
          type:
            - string
            - 'null'
          example: null
        runtime:
          type: integer
          description: 'Episode runtime in seconds; 0 for announced-only episodes'
          example: 780
        images:
          type: object
          required:
            - landscape
          additionalProperties: false
          properties:
            landscape:
              type:
                - string
                - 'null'
              format: uri
              description: 'Episode still (16x9)'
        progress:
          $ref: '#/components/schemas/progress'
        play_url:
          type: string
          format: uri-reference
          description: 'Playback endpoint (`GET`); absent for announced episodes. For `epg`, the channel teleteka or archive.'
          example: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/seasons/1/episodes/6a0188bc9e35a34e3a098ec8/play
    similarBlock:
      type: object
      description: 'Titles similar to this one, as a page block.'
      required:
        - id
        - title
        - type
        - count
        - items
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Always `similar`'
          example: similar
        title:
          type: string
          description: 'Block title (`title` parameter or default)'
          example: Похожее
        type:
          type: string
          description: 'Block type (`type` parameter or `list`)'
          example: list
        count:
          type: integer
          description: 'Number of items (at most 25)'
          example: 1
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/sourcedContentCard'
    favoritesList:
      type: object
      description: "The client's favorites, newest first."
      required:
        - count
        - items
      additionalProperties: false
      properties:
        count:
          type: integer
          description: 'Number of items in the list'
          example: 2
        items:
          type: array
          description: 'TV channel cards first, then VOD content cards'
          items:
            oneOf:
              -
                $ref: '#/components/schemas/favoriteChannelCard'
              -
                $ref: '#/components/schemas/sourcedContentCard'
    favoriteChannelCard:
      type: object
      description: 'A favorite TV channel; a `channelCard` that always has `favorite_url`.'
      required:
        - id
        - kind
        - title
        - images
        - playable
        - favorite
        - capabilities
        - access
        - current_program
        - play_url
        - epg_url
        - favorite_url
      additionalProperties: false
      properties:
        id:
          type: string
          description: 'Channel identifier'
          example: '105'
        kind:
          type: string
          description: 'Channel kind'
          enum:
            - channel
            - playlist
            - radio
          example: channel
        title:
          type: string
          description: 'Channel name; a timeshifted variant ends with the shift, e.g. `Первый канал HD [-3]`'
          example: 'Первый канал HD'
        images:
          type: object
          required:
            - logo
            - background
          additionalProperties: false
          properties:
            logo:
              type:
                - string
                - 'null'
              format: uri
              description: 'Channel logo'
              example: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png'
            background:
              type:
                - string
                - 'null'
              format: uri
              description: 'Channel background (EPG) image'
              example: 'https://imgcdnv2.kartina.stream/img/ui/epg-00105.png'
        playable:
          type: boolean
          description: 'Whether the item can be played directly (currently always true)'
        favorite:
          type: boolean
          description: 'Always true in the favorites list'
        capabilities:
          type: object
          required:
            - archive
            - timeshift
          additionalProperties: false
          properties:
            archive:
              type: boolean
              description: 'Catch-up archive is available (the teleteka is gated separately)'
            timeshift:
