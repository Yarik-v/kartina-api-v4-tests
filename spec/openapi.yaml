    clientSettings:
      type: object
      description: 'Each setting is `{value, allowed}`; `catchup` is `{enabled, delay, length}`. Change via `POST /settings`.'
      required:
        - standard
        - server
        - bitrate
        - caching
        - timeshift
        - catchup
      additionalProperties: false
      properties:
        standard:
          type: object
          description: 'Stream standard (protocol / codec).'
          required:
            - value
            - allowed
          additionalProperties: false
          properties:
            value:
              type: string
              description: 'Current stream standard'
              enum:
                - http
                - udt
                - hls
              example: http
            allowed:
              type: array
              description: 'Standards available for the device'
              items:
                type: object
                required:
                  - value
                  - label
                additionalProperties: false
                properties:
                  value: { type: string, description: 'Standard code', example: http }
                  label: { type: string, description: 'Display name', example: 'HTTP / H.264' }
              example:
                -
                  value: http
                  label: 'HTTP / H.264'
                -
                  value: udt
                  label: 'UDT / H.264'
                -
                  value: hls
                  label: 'HLS / HEVC'
        server:
          type: object
          description: 'Stream server location. `auto`: device-bound serials only; `cloud`: VIP packets only.'
          required:
            - value
            - allowed
          additionalProperties: false
          properties:
            value:
              type: string
              description: 'Current location code or `auto`'
              example: auto
            allowed:
              type: array
              description: 'Server locations available for the client'
              items:
                type: object
                required:
                  - value
                  - label
                additionalProperties: false
                properties:
                  value: { type: string, description: 'Location code', example: fra }
                  label: { type: string, description: 'Display name', example: 'Europe South' }
              example:
                -
                  value: fra
                  label: 'Europe South'
                -
                  value: ber
                  label: 'Europe Middle'
                -
                  value: ams
                  label: 'Europe North'
                -
                  value: ny
                  label: 'USA East Coast'
                -
                  value: sj
                  label: 'USA West Coast'
                -
                  value: ci
                  label: 'USA North'
                -
                  value: tlv
                  label: 'Middle East'
                -
                  value: auto
                  label: ABTO
        bitrate:
          type: object
          description: 'Stream bitrate. Only `900` (`Auto`) is offered when `standard` is `hls`.'
          required:
            - value
            - allowed
          additionalProperties: false
          properties:
            value:
              type: integer
              description: 'Current bitrate in kbps'
              example: 1500
            allowed:
              type: array
              description: 'Available bitrate options'
              items:
                type: object
                required:
                  - value
                  - label
                additionalProperties: false
                properties:
                  value: { type: integer, description: 'Bitrate in kbps', example: 1500 }
                  label: { type: string, description: 'Display name', example: Standard }
              example:
                -
                  value: 2500
                  label: Premium
                -
                  value: 1500
                  label: Standard
                -
                  value: 900
                  label: Eco
                -
                  value: 320
                  label: Mobile
        caching:
          type: object
          description: 'Client-side buffering; only `3000` for `hls`.'
          required:
            - value
            - allowed
          additionalProperties: false
          properties:
            value:
              type: integer
              description: 'Current buffering in milliseconds'
              example: 3000
            allowed:
              type: array
              description: 'Available buffering options'
              items:
                type: object
                required:
                  - value
                  - label
                additionalProperties: false
                properties:
                  value: { type: integer, description: 'Buffering in milliseconds', example: 3000 }
                  label: { type: string, description: 'Display name', example: '3 sec' }
              example:
                -
                  value: 1500
                  label: '1.5 sec'
                -
                  value: 3000
                  label: '3 sec'
                -
                  value: 5000
                  label: '5 sec'
                -
                  value: 8000
                  label: '8 sec'
                -
                  value: 15000
                  label: '15 sec'
        timeshift:
          type: object
          description: 'Broadcast schedule shift in hours (`5` is not offered).'
          required:
            - value
            - allowed
          additionalProperties: false
          properties:
            value:
              type: integer
              description: 'Current shift in hours'
              example: 0
            allowed:
              type: array
              description: 'Available shift options'
              items:
                type: object
                required:
                  - value
                  - label
                additionalProperties: false
                properties:
                  value: { type: integer, description: 'Shift in hours', example: 2 }
                  label: { type: string, description: 'Display name', example: '-2' }
              example:
                -
                  value: 0
                  label: '0'
                -
                  value: 1
                  label: '-1'
                -
                  value: 2
                  label: '-2'
                -
                  value: 3
                  label: '-3'
                -
                  value: 4
                  label: '-4'
                -
                  value: 6
                  label: '-6'
                -
                  value: 7
                  label: '-7'
                -
                  value: 8
                  label: '-8'
                -
                  value: 9
                  label: '-9'
                -
                  value: 10
                  label: '-10'
                -
                  value: 11
                  label: '-11'
                -
                  value: 12
                  label: '-12'
        catchup:
          type: object
          description: 'Archive (catchup) state; `delay` and `length` depend on the current `standard`.'
          required:
            - enabled
            - delay
            - length
          additionalProperties: false
          properties:
            enabled:
              type: integer
              description: 'Whether catchup is enabled (`1`) or disabled (`0`)'
              enum:
                - 0
                - 1
              example: 1
            delay:
              type: integer
              description: 'Seconds before a programme enters the archive'
              example: 1800
            length:
              type: integer
              description: 'Archive depth in seconds (~14 days)'
              example: 1209480
    trailerStream:
      type: object
