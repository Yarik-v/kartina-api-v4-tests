  /login:
    post:
      operationId: login
      summary: 'Authenticate the client and open a session.'
      description: "Returns the client, packet and session without a wrapper; the session id is also set\nas the `MW_SSID` cookie. `X-Token` is not the session id.\n"
      tags:
