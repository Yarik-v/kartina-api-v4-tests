        age_band:
          type: integer
          description: 'Maximum content age; `0` means no restriction'
          enum:
            - 0
            - 7
            - 12
            - 16
          example: 12
    profilePayload:
      type: object
      description: 'Write payload for create and update.'
      required:
        - name
        - age_band
      additionalProperties: false
      properties:
        name:
          type: string
