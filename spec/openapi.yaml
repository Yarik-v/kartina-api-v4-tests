          description: 'Authentication required or not a Mobile Free user'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                authRequired:
                  summary: 'Authentication required or session invalid'
                  value: { error: { type: E_AUTH_ERROR, code: 12, message: 'Authentication error', request_id: 019ed9ed-812d-7b02-b5e9-767e08a8fa58, details: { title: null, description: 'Wrong session. Client is not authorized' } } }
