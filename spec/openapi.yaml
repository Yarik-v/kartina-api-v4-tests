                - archive
                - timeshift
              additionalProperties: false
              properties:
                archive:
                  type: boolean
                  description: 'Catch-up archive is available (the teleteka is gated separately)'
                timeshift:
                  type: boolean
                  description: 'This channel is a timeshifted variant'
            access:
              type: object
              required:
                - protected
                - hidden
              additionalProperties: false
              properties:
