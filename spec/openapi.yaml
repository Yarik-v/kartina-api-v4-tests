openapi: 3.2.0
info:
  title: 'API documentation · Kartina.TV'
  version: 4.0.0
  contact:
    name: Kartina.TV
    email: team@kartina.tv
servers:
  -
    url: '{scheme}://{host}/api/v4'
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      host:
        default: rustvt.kartina.tv
        enum:
          - iptv.kartina.tv
          - rustvt.kartina.tv
          - localhost
security:
  -
    cookie_auth: []
tags:
  -
    name: Account
    description: 'Session, profile, settings and everything else stored per account.'
    kind: nav
  -
    name: Catalog
    description: 'Services, live channels, radio, VOD and search over them.'
    kind: nav
  -
    name: Interface
    description: 'Pages and the blocks they are built from.'
    kind: nav
  -
    name: Blocks
    parent: Interface
    description: 'Page blocks: continue watching, recommendations, channel groups and more.'
  -
    name: Channels
    parent: Catalog
    description: 'Live TV: EPG, playback, archive, teleteka and hidden channels.'
  -
    name: Client
    parent: Account
    description: 'Client info, device settings and the protect code.'
  -
    name: Content
    parent: Catalog
    description: 'VOD titles: details, similar titles and playback.'
  -
    name: Favorites
    parent: Account
    description: 'Favorite channels and VOD titles.'
  -
    name: Other
    description: 'Server time, the screensaver and speed test servers.'
  -
    name: Pages
    parent: Interface
    description: 'Screen layouts: TV, radio and other pages.'
  -
    name: Profiles
    parent: Account
    description: 'Subscription profiles and the one the session acts as.'
  -
    name: Radio
    parent: Catalog
    description: 'Radio stations (deprecated).'
  -
    name: 'Registration Prompt'
    parent: Account
    description: 'Dismissal of the personal-cabinet registration prompt.'
  -
    name: Search
    parent: Catalog
    description: 'Search, filter facets and search history.'
  -
    name: Security
    parent: Account
    description: 'Session lifecycle: login and logout.'
  -
    name: Services
    parent: Catalog
    description: 'Multimedia services, their credentials and content pages.'
  -
    name: Sharing
    parent: Account
    description: 'Sharing a Premium subscription with friends (Mobile Friend).'
paths:
  /blocks/playback:
    get:
      operationId: getPlaybackBlock
      summary: 'Retrieve the "continue watching" block.'
      description: "TV programmes (`programCard`) and VOD titles (`playbackContentCard`) watched in the\nlast 14 days; branch on `kind`, resume via `play_url`. Entries under 90 s or past 95%\nare skipped; a finished episode yields the next one.\n"
      tags:
        - Blocks
      parameters:
        -
          $ref: '#/components/parameters/playbackLimit'
        -
          $ref: '#/components/parameters/playbackTitle'
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/playbackBlock'
              example:
                id: playback
                title: 'Продолжить просмотр'
                type: playback
                count: 2
                items:
                  - { id: 'archive:105:1781766000', kind: program, service: channels, starts_at: 1781766000, ends_at: 1781769600, title: Время, subtitle: null, description: 'Информационная программа о событиях в стране и мире.', year: null, genres: ['информационная программа'], runtime: 3600, age_rating: 16, ratings: { kinopoisk: null, imdb: null }, images: { poster: null, landscape: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg?action=resize&width=400&height=225' }, channel: { id: '105', title: 'Первый канал HD', logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png' }, teleteka: false, playable: true, favorite: false, progress: { position: 1250, duration: 3600, completed: false, updated_at: 1781767250, target: { id: 'archive:105:1781766000', kind: program } }, play_url: /api/v4/channels/105/archive/1781766000, epg_url: /api/v4/channels/105/epg }
                  - { id: 6a0188bc9e35a34e3a098ec7, kind: series, service: mediateka, title: Простоквашино, subtitle: 'Серия 5', description: 'Родители не разрешают мальчику по прозвищу Дядя Фёдор заводить животных, и он вместе с говорящим котом Матроскиным и псом Шариком бежит из дома в деревню Простоквашино.', year: '2025', genres: [Приключения, Семейный], runtime: 1302, age_rating: 6, ratings: { kinopoisk: 6.8, imdb: null }, images: { poster: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957420.jpeg?action=resize&width=220&height=330', landscape: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg?action=resize&width=400&height=225' }, playable: true, favorite: false, progress: { position: 420, duration: 1302, completed: false, updated_at: 1781765800, target: { id: 6a0188bc9e35a34e3a098ec8, kind: episode } }, details_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7, play_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/play, favorite_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/favorite }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
  '/blocks/playback/{origin}':
    get:
      operationId: getPlaybackBlockByOrigin
      summary: 'Retrieve the "continue watching" block of one origin.'
      description: 'Same as `GET /blocks/playback`, for `channels` (TV) or one VOD service.'
      tags:
        - Blocks
      parameters:
        -
          name: origin
          in: path
          required: true
          description: '`channels` for TV, or a VOD service id (aliases accepted)'
          schema:
            type: string
            enum:
              - channels
              - filmua
              - film-ua
              - mediateka
              - moretv
              - more-tv
              - pamg
              - premierone
              - tntpremier
              - souzmultru
              - kinopoiskru
              - uzbektv
              - mediatekafree
              - volna
              - unicoplaycom
          example: channels
        -
          $ref: '#/components/parameters/playbackLimit'
        -
          $ref: '#/components/parameters/playbackTitle'
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/playbackBlock'
              example:
                id: playback
                title: 'Продолжить просмотр'
                type: playback
                count: 1
                items:
                  - { id: 'teleteka:2099:1781761200', kind: program, service: channels, starts_at: 1781761200, ends_at: 1781770200, title: 'Вечер с Владимиром Соловьёвым', subtitle: null, description: 'Общественно-политическое ток-шоу.', year: null, genres: [ток-шоу], runtime: 9000, age_rating: 16, ratings: { kinopoisk: null, imdb: null }, images: { poster: null, landscape: 'https://imgcdnv2.kartina.stream/img/ui/epg-02099.png' }, channel: { id: '2099', title: 'Россия HD', logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-02099.png' }, teleteka: true, playable: true, favorite: false, progress: { position: 3600, duration: 9000, completed: false, updated_at: 1781764800, target: { id: 'teleteka:2099:1781761200', kind: program } }, play_url: /api/v4/channels/2099/teleteka/1781761200, epg_url: /api/v4/channels/2099/epg }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
        '404':
          $ref: '#/components/responses/notFound'
  /blocks/watching-now:
    get:
      operationId: getWatchingNowBlock
      summary: 'Retrieve the "watching now" recommendations block.'
      description: "Up to 25 VOD titles popular in the client's country, as a page block; unsubscribed services are left out."
      tags:
        - Blocks
      parameters:
        -
          name: title
          in: query
          required: false
          description: 'Block title override'
          schema:
            type: string
            default: 'Сейчас смотрят'
        -
          name: type
          in: query
          required: false
          description: 'Block `type` override'
          schema:
            type: string
            default: list
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/watchingNowBlock'
              example:
                id: watching_now
                title: 'Сейчас смотрят'
                type: list
                count: 1
                items:
                  - { id: 6a0188bc9e35a34e3a098ec7, kind: series, service: mediateka, title: Простоквашино, description: 'Родители не разрешают мальчику по прозвищу Дядя Фёдор заводить животных, и он вместе с говорящим котом Матроскиным и псом Шариком бежит из дома в деревню Простоквашино.', year: '2025', genres: [Приключения, Семейный], runtime: 5302, ratings: { kinopoisk: 6.8, imdb: null }, images: { poster: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957420.jpeg?action=resize&width=220&height=330', landscape: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg?action=resize&width=400&height=225' }, playable: true, favorite: false, progress: null, details_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7, favorite_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/favorite }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
  /blocks/recommendations:
    get:
      operationId: getRecommendationsBlock
      summary: 'Retrieve the personal recommendations block.'
      description: 'Up to 25 VOD titles picked for the client, as a page block; unsubscribed services are left out.'
      tags:
        - Blocks
      parameters:
        -
          name: title
          in: query
          required: false
          description: 'Block title override'
          schema:
            type: string
            default: Рекомендованные
        -
          name: type
          in: query
          required: false
          description: 'Block `type` override'
          schema:
            type: string
            default: list
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recommendationsBlock'
              example:
                id: recommendations
                title: Рекомендованные
                type: list
                count: 1
                items:
                  - { id: 6a0188bc9e35a34e3a098ec7, kind: series, service: mediateka, title: Простоквашино, description: 'Родители не разрешают мальчику по прозвищу Дядя Фёдор заводить животных, и он вместе с говорящим котом Матроскиным и псом Шариком бежит из дома в деревню Простоквашино.', year: '2025', genres: [Приключения, Семейный], runtime: 5302, ratings: { kinopoisk: 6.8, imdb: null }, images: { poster: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957420.jpeg?action=resize&width=220&height=330', landscape: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg?action=resize&width=400&height=225' }, playable: true, favorite: false, progress: null, details_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7, favorite_url: /api/v4/content/mediateka/6a0188bc9e35a34e3a098ec7/favorite }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
  /blocks/client-channels:
    get:
      operationId: getClientChannelsBlock
      summary: "Retrieve the client's favorite-channels block."
      description: "Up to 20 of the client's most-watched TV channels, as a channel-group block. Hidden channels are not filtered out."
      tags:
        - Blocks
      parameters:
        -
          name: title
          in: query
          required: false
          description: 'Block title override'
          schema:
            type: string
            default: 'Любимые телеканалы'
        -
          name: type
          in: query
          required: false
          description: 'Block `type` override'
          schema:
            type: string
            default: small_list
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/clientChannelsBlock'
              example:
                id: client_channels
                title: 'Любимые телеканалы'
                type: small_list
                count: 1
                items:
                  - { id: '105', kind: channel, title: 'Первый канал HD', images: { logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png', background: 'https://imgcdnv2.kartina.stream/img/ui/epg-00105.png' }, playable: true, favorite: true, capabilities: { archive: true, timeshift: false }, access: { protected: false, hidden: false }, current_program: { starts_at: 1781766000, ends_at: 1781769600, title: Время, subtitle: null, category: Новости, genres: ['информационная программа'], age_rating: 16, image: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg' }, play_url: /api/v4/channels/105/play, epg_url: /api/v4/channels/105/epg, favorite_url: /api/v4/channels/105/favorite }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
  /blocks/last-news:
    get:
      operationId: getLastNewsBlock
      summary: 'Retrieve the "last news" teleteka block.'
      description: "The latest teleteka newscast of each news channel over 24 hours (up to 20, newest\nfirst), as a channel-group block. `current_program` is the newscast: play it via\n`GET /channels/{id}/teleteka/{starts_at}`.\n"
      tags:
        - Blocks
      parameters:
        -
          name: title
          in: query
          required: false
          description: 'Block title override'
          schema:
            type: string
            default: 'Последние новости'
        -
          name: type
          in: query
          required: false
          description: 'Block `type` override'
          schema:
            type: string
            default: small_list
        -
          $ref: '#/components/parameters/ifNoneMatch'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lastNewsBlock'
              example:
                id: last_news
                title: 'Последние новости'
                type: small_list
                count: 1
                items:
                  - { id: '6', kind: channel, title: 'Первый канал HD', images: { logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-00006.png', background: 'https://imgcdnv2.kartina.stream/img/ui/epg-00006.png' }, playable: true, favorite: false, capabilities: { archive: true, timeshift: false }, access: { protected: false, hidden: false }, current_program: { starts_at: 1781766000, ends_at: 1781769600, title: Время, subtitle: 'Вечерний выпуск', category: Новости, genres: ['информационная программа'], age_rating: 16, image: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg?action=resize&width=400&height=225' }, play_url: /api/v4/channels/6/play, epg_url: /api/v4/channels/6/epg, favorite_url: /api/v4/channels/6/favorite }
          headers:
            ETag:
              $ref: '#/components/headers/etag'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '304':
          $ref: '#/components/responses/notModified'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          $ref: '#/components/responses/authRequired'
  '/pages/tv/channel-groups/{id}':
    get:
      operationId: getTvChannelGroupBlock
      summary: 'Retrieve a TV channel-group block.'
      description: "Watchable channels of a group from `GET /pages/tv`; hidden ones only with `show=1`.\nRadio: `GET /pages/radio/channel-group`.\n"
      tags:
        - Blocks
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'Channel-group identifier'
          schema:
            type: integer
            minimum: 1
          example: 2
        -
          name: show
          in: query
          required: false
          description: '`1` includes hidden channels (requires `protect`)'
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: protect
          in: query
          required: false
          description: 'Protect code; required with `show`'
          schema:
            type: string
          example: '1234'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/channelGroupBlock'
              example:
                id: '2'
                title: Основные
                type: channel_group
                count: 1
                protected: false
                items:
                  - { id: '105', kind: channel, title: 'Первый канал HD', images: { logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png', background: 'https://imgcdnv2.kartina.stream/img/ui/epg-00105.png' }, playable: true, favorite: true, capabilities: { archive: true, timeshift: false }, access: { protected: false, hidden: false }, current_program: { starts_at: 1781766000, ends_at: 1781769600, title: Время, subtitle: null, category: Новости, genres: ['информационная программа'], age_rating: 16, image: 'https://imgcdnv2.kartina.stream/mw-epg-prod/epgservice/d2d26a2a-cd73-5e9b-8397-18c9bf35c796/9957423.jpeg' }, play_url: /api/v4/channels/105/play, epg_url: /api/v4/channels/105/epg, favorite_url: /api/v4/channels/105/favorite }
          headers:
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '400':
          $ref: '#/components/responses/invalidRequest'
        '403':
          description: 'Authentication required (`E_AUTH_ERROR`), or the `protect` code is wrong when `show` is used (`E_CURRENT_PASS_BAD`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                authRequired:
                  summary: 'No or invalid session'
                  value: { error: { type: E_AUTH_ERROR, code: 12, message: 'Authentication error', request_id: 019ed9ed-812d-7b02-b5e9-767e08a8fa58, details: { title: null, description: 'Wrong session. Client is not authorized' } } }
                incorrectProtectCode:
                  summary: 'Wrong protect code'
                  value: { error: { type: E_CURRENT_PASS_BAD, code: 19, message: 'Неверный пароль.', request_id: 019f36a1-2b40-7670-8f3a-7f50f19bb32e, details: { title: null, description: 'Incorrect code' } } }
          headers:
            X-Api-Error-Code:
              $ref: '#/components/headers/apiErrorCode'
            X-Api-Error-Message:
              $ref: '#/components/headers/apiErrorMessage'
        '404':
          $ref: '#/components/responses/notFound'
  /pages/radio/channel-group:
    get:
      operationId: getRadioChannelGroupBlock
      summary: 'Retrieve the radio channel-group block.'
      description: 'The radio group, like `GET /pages/tv/channel-groups/{id}`; hidden stations only with `show=1`.'
      tags:
        - Blocks
      parameters:
        -
          name: show
          in: query
          required: false
          description: '`1` includes hidden stations (requires `protect`)'
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: protect
          in: query
          required: false
          description: 'Protect code; required with `show`'
          schema:
            type: string
          example: '1234'
        -
          $ref: '#/components/parameters/refreshCache'
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/radioGroupBlock'
              example:
                id: '23'
                title: Радио
                type: channel_group
                count: 1
                protected: false
                items:
