      requestBody:
        $ref: '#/components/requestBodies/login'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required:
                  - login
                  - expire_at
                  - packet
                  - security
                  - services
                  - settings
                  - has_personal_account
                  - registration_prompt
                properties:
                  login: { type: integer, description: 'Client login code', example: 7704638 }
                  expire_at: { type: integer, description: 'Contract expiration Unix timestamp', example: 1798149600 }
                  packet: { type: object, required: [id, title, type, share_links], additionalProperties: false, properties: { id: { type: integer, description: 'Packet ID', example: 269 }, title: { type: string, description: 'Packet name', example: 'VIP ПАКЕТ(*ПОЛНЫЙ*)' }, type: { type: string, description: 'Packet type slug', example: vip }, share_links: { type: [string, 'null'], description: 'Always null here; see `GET /account`', example: null } } }
                  security: { type: string, description: 'Session ID (MW_SSID)', example: 1937db2ff2caa35bf92975f0d795fa0e }
                  services: { type: string, description: 'Services endpoint path', example: /api/v4/services }
                  settings: { type: string, description: 'Settings endpoint path', example: /api/v4/settings }
                  has_personal_account: { $ref: '#/components/schemas/hasPersonalAccount' }
                  registration_prompt: { $ref: '#/components/schemas/registrationPrompt' }
                  mirror: { type: string, description: 'Alternative server by geo-location; only with geo-routing', example: alt.kartina.tv }
          headers:
            X-Token:
              schema:
                type: string
              description: 'Encrypted token containing login, expire, IP, and serial'
            X-Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Api-Messages:
              $ref: '#/components/headers/apiMessages'
            X-Api-Servertime:
              $ref: '#/components/headers/apiServertime'
        '400':
          description: 'Missing required parameter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                missingLogin:
                  summary: 'login not provided'
                  value: { error: { type: E_NEED_PARAM, code: 23, message: 'Need parameter', request_id: 019ed9f5-e719-7c5a-8df7-aa7ca10a66a0, details: { title: null, description: 'login: This value should not be blank.' } } }
                missingDevice:
                  summary: 'device not provided'
