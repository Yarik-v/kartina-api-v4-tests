          headers:
            X-Api-Error-Code:
              $ref: '#/components/headers/apiErrorCode'
            X-Api-Error-Message:
              $ref: '#/components/headers/apiErrorMessage'
        '403':
          description: 'Wrong login or password'
          content:
            application/problem+json:
