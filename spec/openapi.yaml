                  - { id: d2d26a2acd735e9b839718c9bf35c796, kind: series, service: epg, title: Простоквашино, description: 'Мультсериал о каникулах Дяди Фёдора в деревне.', year: '2024', genres: [мультсериал], runtime: null, age_rating: 0, ratings: { kinopoisk: null, imdb: null }, images: { poster: null, landscape: 'https://imgcdnv2.kartina.stream/img/ui/epg-00105.png' }, playable: false, favorite: false, progress: null, channel: { id: '105', title: 'Первый канал HD', logo: 'https://imgcdnv2.kartina.stream/img/ui/channel-00105.png' }, epg_url: '/api/v4/channels/105/epg?title_id=245079&relevant=1785225600,1785139200' }
