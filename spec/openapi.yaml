              details:
                title: null
                description: null
      headers:
        X-Api-Error-Code:
          $ref: '#/components/headers/apiErrorCode'
        X-Api-Error-Message:
          $ref: '#/components/headers/apiErrorMessage'
    profileNotFound:
      description: 'No such profile on this subscription (`E_WRONG_ID`)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              type: E_WRONG_ID
              code: 39
              message: 'Wrong id'
              request_id: 01a0a8ff-3be8-7250-a1f0-bd8879842e36
              details:
                title: null
                description: 'Profile 99999999 not found.'
      headers:
        X-Api-Error-Code:
          $ref: '#/components/headers/apiErrorCode'
        X-Api-Error-Message:
          $ref: '#/components/headers/apiErrorMessage'
    profileInvalidPayload:
      description: '`E_NEED_PARAM`: `name` or `age_band` missing. `E_VALUE_NOT_ALLOWED`: unknown `avatar` or `age_band`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error:
              type: E_VALUE_NOT_ALLOWED
              code: 22
              message: 'This value is not allowed'
              request_id: 01a0a8ff-3ae3-7727-9f2c-56345620dac8
              details:
                title: null
                description: 'Unknown age band "99".'
      headers:
        X-Api-Error-Code:
          $ref: '#/components/headers/apiErrorCode'
        X-Api-Error-Message:
          $ref: '#/components/headers/apiErrorMessage'
  requestBodies:
    protectCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - code
            additionalProperties: false
            properties:
              code:
                type: string
                description: "The client's protect (parental) code"
                example: '1234'
    login:
      description: 'Login credentials and device info'
      content:
        application/json:
          schema:
            properties:
              login:
                $ref: '#/components/schemas/login'
              password:
                $ref: '#/components/schemas/password'
              device:
                type: string
                description: 'Device model identifier'
                example: androidtv-yb-005
              serial:
                type: string
                description: 'Device serial number'
                example: GC175K002184308445
              push_token:
                type: string
                description: 'Push-notification token for the device'
                example: a3dda5212a608ed800b14e12d549b59177a9024da271b3330f11c34112f188ea
            required:
              - login
              - password
              - device
              - serial
    redeem:
      description: 'Invite code to redeem; also accepted as query parameters.'
      content:
        application/json:
          schema:
            properties:
              code:
                $ref: '#/components/schemas/shareCode'
              lang:
                $ref: '#/components/schemas/lang'
              softid:
                type: string
                description: 'Device identifier to detect a mobile device; defaults to `User-Agent`'
                example: apple-CFNetwork-001
            additionalProperties: false
            required:
              - code
    verificationCode:
      description: 'Send verification code to email or phone.'
      content:
        application/json:
          schema:
            oneOf:
              -
                title: 'Send to email'
                type: object
                required:
                  - email
                additionalProperties: false
                properties:
                  email: { $ref: '#/components/schemas/email' }
              -
                title: 'Send to phone'
                type: object
                required:
                  - phone
                additionalProperties: false
                properties:
                  phone: { $ref: '#/components/schemas/phone' }
          examples:
            byEmail:
              summary: 'Send verification code to email'
              value:
                email: friend@example.com
            byPhone:
              summary: 'Send verification code to phone'
              value:
                phone: '+491234567890'
    account:
      description: 'Email or phone plus the code from `/sharing/code`.'
      content:
        application/json:
          schema:
            oneOf:
              -
                title: 'Create account with email'
                type: object
                required:
                  - code
                  - email
                additionalProperties: false
                properties:
                  code: { $ref: '#/components/schemas/verificationCode' }
                  email: { $ref: '#/components/schemas/email' }
              -
                title: 'Create account with phone'
                type: object
                required:
                  - code
                  - phone
                additionalProperties: false
                properties:
                  code: { $ref: '#/components/schemas/verificationCode' }
                  phone: { $ref: '#/components/schemas/phone' }
          examples:
            byEmail:
              summary: 'Create account with email'
              value:
                code: '123456'
                email: friend@example.com
            byPhone:
              summary: 'Create account with phone'
              value:
                code: '123456'
                phone: '+491234567890'
