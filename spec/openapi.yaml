        block_url:
          type: string
          format: uri-reference
          description: 'Block content (`GET`)'
          example: /api/v4/pages/dashboard/blocks/d689d5b8-81a5-4231-9975-c6dc1e140b9c
        count:
          type: integer
          description: 'Number of visible items (`channel_group` blocks only)'
