  responses:
    playback:
      description: "A playable stream.\n\nNo `ETag` is issued: the URL is single-playback and time-limited, so a conditional\nrequest is never answered with `304`.\n\nA provider the operator switched into failure mode also answers `200`, with `url`\npointing at a short apology clip and `markers` / `vmap` null. Play it like any other\nstream.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/playbackStream'
          examples:
            channel:
              summary: 'live channel'
              value:
                url: 'http/ts://streamer-fra-c1-b6.kartina.stream:18332/?ticket=niTDfeaayKbGfaxBnJiknCOwEtMkkEu7XX06GGxyD43G82z%2FKeI8DDn%2BFA7TISMs8jfxiTGpaEpkIWBiyxVCv9t4e%2BvM3MNCM%2FwA5wt0L4dTHM3LLEbq0rafAgta0CGK0%2BLzA446sWUZZkjIJEYX3YB833wxnZleY7UTMNj86H0%3D&device-id=noname-unset-000 :http-caching=3000 :no-http-reconnect'
                markers: null
                vmap: null
            vod:
              summary: 'VOD episode with skip markers'
              value:
                url: 'https://streamer-fra-c4-b7.kartina.tv:443/vod/hls/videoteka/moretv/CTC-ModnyiSindikat/CTC-ModnyiSindikat_s1e1/index.m3u8?ticket=KKCRzM1UyR2n6MqLtOCQAr3n0%2FNMKrttq0g8h%2F4onmzdwlP%2FgmV%2F5fdQ'
                markers:
                  intro: { start: 0, end: 0 }
                  recap: { start: 0, end: 0 }
                  closing_credits: { start: 2640, end: 2700 }
                vmap: null
      headers:
        X-Api-Version:
          $ref: '#/components/headers/apiVersion'
        X-Api-Messages:
          $ref: '#/components/headers/apiMessages'
        X-Api-Servertime:
          $ref: '#/components/headers/apiServertime'
    playbackUnavailable:
      description: "The stream cannot be served right now (HTTP 503, `E_SERVICE_NOT_AVAILABLE`): the\naddressed service is not configured on this installation. Retrying later is reasonable,\nretrying at once is not.\n\nStreamer selection never surfaces here: when the stream balancer has no candidate or is\nunreachable, the local balancer picks the host and the answer is a normal `200`. A\nservice switched into failure mode is different too: it answers `200` with an apology\nclip.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          examples:
            serviceNotConfigured:
              summary: 'the service is unknown to this installation'
              value:
                error:
                  type: E_SERVICE_NOT_AVAILABLE
                  code: 30
                  message: 'Service is not available'
                  request_id: 019f31e7-9928-7670-8f3a-7f50f19bb32e
                  details: { title: null, description: null }
      headers:
        X-Api-Error-Code:
          $ref: '#/components/headers/apiErrorCode'
        X-Api-Error-Message:
          $ref: '#/components/headers/apiErrorMessage'
